<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2F2ED" />
    <title>Reset Your Password — Atlas</title>
    <meta name="description" content="Choose a new password for your Atlas account." />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://airsoftatlas.app/reset-password.html" />
    <link rel="icon" type="image/jpeg" href="logo.jpg" />
    <link rel="stylesheet" href="styles.css?v=2" />
    <style>
      .reset-form { max-width: 360px; margin: 0 auto; text-align: left; }
      .reset-form label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #686C72; margin: 0 0 6px; }
      .reset-form input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 14px 16px; margin: 0 0 16px; border: 1px solid #D9D9D2; border-radius: 6px; background: #FFFFFF; color: #002C48; }
      .reset-form input:focus { outline: none; border-color: #1554B8; }
      .reset-form button { width: 100%; border: 0; cursor: pointer; margin-top: 4px; }
      .reset-form button[disabled] { opacity: 0.6; cursor: default; }
      .reset-error { color: #B3261E; font-size: 14px; margin: -4px 0 12px; min-height: 0; }
      .reset-for { font-weight: 600; color: #002C48; }
    </style>
  </head>
  <body>
    <nav class="nav">
      <a class="nav-brand" href="index.html">
        <img src="logo.jpg" alt="Atlas" />
        <span>Atlas</span>
      </a>
      <button class="nav-toggle" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M3 6h16M3 11h16M3 16h16" stroke="#002C48" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="players.html">Players</a>
        <a href="owners.html">Field Owners &amp; Event Organizers</a>
        <a href="pricing.html">Pricing</a>
        <a href="about.html">About</a>
      </div>
    </nav>

    <div class="wrap center">
      <img class="logo" src="logo.jpg" alt="Atlas" />
      <h1>Reset Password</h1>
      <p class="tagline" id="reset-status">Checking your link&hellip;</p>

      <form class="reset-form" id="reset-form" style="display:none;" novalidate>
        <label for="pw1">New password</label>
        <input id="pw1" type="password" autocomplete="new-password" minlength="6" required />
        <label for="pw2">Confirm new password</label>
        <input id="pw2" type="password" autocomplete="new-password" minlength="6" required />
        <p class="reset-error" id="reset-error"></p>
        <button class="cta" id="reset-submit" type="submit">Save New Password</button>
      </form>

      <a class="cta" id="reset-continue" href="#" style="display:none;"></a>
    </div>

    <script src="nav.js"></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

      // Same public-safe client config as verify-email.html (and every app
      // bundle). The web API key identifies the project; it isn't a secret.
      const firebaseConfig = {
        apiKey: "AIzaSyD4wCMF_drnENoRz6wkRRbdxyO9d2n2QFE",
        authDomain: "atlas-players-app.firebaseapp.com",
        projectId: "atlas-players-app",
        storageBucket: "atlas-players-app.firebasestorage.app",
        messagingSenderId: "211739354235",
        appId: "1:211739354235:web:a6f20f9d2e13c409a96ede",
      };

      const statusEl = document.getElementById("reset-status");
      const form = document.getElementById("reset-form");
      const errEl = document.getElementById("reset-error");
      const submitBtn = document.getElementById("reset-submit");
      const params = new URLSearchParams(location.search);
      const oobCode = params.get("oobCode");

      // Where to send them afterwards. Only ever an Atlas domain, never an
      // arbitrary URL from the query string.
      let next = null;
      try {
        const u = new URL(params.get("continueUrl") || "");
        if (u.protocol === "https:" && (u.hostname === "airsoftatlas.app" || u.hostname.endsWith(".airsoftatlas.app"))) next = u;
      } catch (_) {}
      const isOwner = !!next && next.hostname.startsWith("ownerapp.");

      function showContinue() {
        const btn = document.getElementById("reset-continue");
        btn.textContent = isOwner ? "Sign in to Atlas for Hosts →" : "Sign in to Atlas →";
        btn.href = next ? next.href : "https://playerapp.airsoftatlas.app/";
        btn.style.display = "inline-block";
      }

      const expiredMsg = "This link has expired or was already used. Reset links last one hour — tap “Forgot password?” on the Atlas sign-in screen to get a new one.";

      if (params.get("mode") !== "resetPassword" || !oobCode) {
        statusEl.textContent = "This link looks incomplete — open it directly from the email Atlas sent you.";
      } else {
        const auth = getAuth(initializeApp(firebaseConfig));
        verifyPasswordResetCode(auth, oobCode)
          .then((email) => {
            statusEl.innerHTML = "";
            statusEl.append("Choose a new password for ");
            const b = document.createElement("span");
            b.className = "reset-for";
            b.textContent = email;
            statusEl.append(b, ".");
            form.style.display = "block";
            document.getElementById("pw1").focus();
          })
          .catch(() => {
            statusEl.textContent = expiredMsg;
            showContinue();
          });

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          errEl.textContent = "";
          const pw1 = document.getElementById("pw1").value;
          const pw2 = document.getElementById("pw2").value;
          if (pw1.length < 6) { errEl.textContent = "Password needs to be at least 6 characters."; return; }
          if (pw1 !== pw2) { errEl.textContent = "Those passwords don't match."; return; }
          submitBtn.disabled = true;
          submitBtn.textContent = "Saving…";
          try {
            await confirmPasswordReset(auth, oobCode, pw1);
            form.style.display = "none";
            statusEl.textContent = "Password updated. Sign in with your new password — it works in both the Atlas player app and Atlas for Hosts.";
            showContinue();
          } catch (err) {
            submitBtn.disabled = false;
            submitBtn.textContent = "Save New Password";
            if (err?.code === "auth/weak-password") errEl.textContent = "That password is too weak — try a longer one.";
            else if (err?.code === "auth/expired-action-code" || err?.code === "auth/invalid-action-code") {
              form.style.display = "none";
              statusEl.textContent = expiredMsg;
              showContinue();
            } else errEl.textContent = "Something went wrong — try again.";
          }
        });
      }
    </script>
  </body>
</html>
