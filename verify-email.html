<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2F2ED" />
    <title>Verify Your Email — Atlas</title>
    <meta name="description" content="Confirm your email address for your Atlas account." />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://airsoftatlas.app/verify-email.html" />
    <link rel="icon" type="image/jpeg" href="logo.jpg" />
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <nav class="nav">
      <a class="nav-brand" href="index.html">
        <img src="logo.jpg" alt="Atlas" />
        <span>Atlas</span>
      </a>
      <button class="nav-toggle" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M3 6h16M3 11h16M3 16h16" stroke="#002C48" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="players.html">Players</a>
        <a href="owners.html">Field Owners &amp; Event Organizers</a>
        <a href="pricing.html">Pricing</a>
        <a href="about.html">About</a>
      </div>
    </nav>

    <div class="wrap center">
      <img class="logo" src="logo.jpg" alt="Atlas" />
      <h1>Email Verification</h1>
      <p class="tagline" id="verify-status">Verifying your email&hellip;</p>
      <a class="cta" id="verify-continue" href="#" style="display:none;"></a>
    </div>

    <script src="nav.js"></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { getAuth, applyActionCode } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

      // Public-safe client config — the same values baked into every
      // build of the player/owner apps (filled 2026-10-13 from the live
      // owner-app bundle). A Firebase web API key identifies the project;
      // it isn't a secret — Firestore/Storage rules are what protect data.
      const firebaseConfig = {
        apiKey: "AIzaSyD4wCMF_drnENoRz6wkRRbdxyO9d2n2QFE",
        authDomain: "atlas-players-app.firebaseapp.com",
        projectId: "atlas-players-app",
        storageBucket: "atlas-players-app.firebasestorage.app",
        messagingSenderId: "211739354235",
        appId: "1:211739354235:web:a6f20f9d2e13c409a96ede",
      };

      const statusEl = document.getElementById("verify-status");
      const params = new URLSearchParams(location.search);

      if (params.get("mode") !== "verifyEmail" || !params.get("oobCode")) {
        statusEl.textContent = "This link looks incomplete — open it directly from the email Atlas sent you.";
      } else {
        const auth = getAuth(initializeApp(firebaseConfig));
        applyActionCode(auth, params.get("oobCode"))
          .then(() => {
            statusEl.textContent = "Email verified — you're all set. You can close this tab and head back to Atlas.";
            // Firebase passes along the continue URL the email was sent
            // with (e.g. the owner app, for a field claim). Only ever link
            // back to an Atlas domain, never an arbitrary URL.
            try {
              const next = new URL(params.get("continueUrl") || "");
              if (next.protocol === "https:" && (next.hostname === "airsoftatlas.app" || next.hostname.endsWith(".airsoftatlas.app"))) {
                const btn = document.getElementById("verify-continue");
                const isOwner = next.hostname.startsWith("ownerapp.");
                statusEl.textContent = isOwner
                  ? "Email verified. Head back to the owner app and tap Claim on your field again — it'll go through instantly."
                  : "Email verified — you're all set.";
                btn.textContent = isOwner ? "Back to the Owners App →" : "Back to Atlas →";
                btn.href = next.href;
                btn.style.display = "inline-block";
              }
            } catch (_) { /* no or malformed continueUrl — plain message stays */ }
          })
          .catch(() => {
            statusEl.textContent = "This link has expired or was already used.";
          });
      }
    </script>
  </body>
</html>
